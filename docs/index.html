<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>IDK.org</title>
  <link rel="stylesheet" href="styles.css">
  </style>
</head>
<body>
<div class="container">
  <div id="message" class="card" style="display:none;"></div>
  <div id="login" class="card">
    <h2>Login / Register</h2>
    <input type="text" id="name" placeholder="Name (optional for login)" />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <input type="password" id="confirm" placeholder="Confirm password" />
    <button id="loginBtn">Login</button>
    <button id="registerBtn">Register</button>
  </div>
  <div id="quiz" class="card" style="display:none;">
    <h2>Quiz</h2>
    <div class="progress" id="quizProgress"></div>
    <div id="quizQuestion"></div>
    <button id="nextBtn" disabled>Next</button>
  </div>
  <div id="result" class="card" style="display:none;">
    <h2>Result</h2>
    <div id="resultText"></div>
  </div>
  <div id="tutor" class="card" style="display:none;">
    <h2>Tutor</h2>
    <div class="chat" id="chat"></div>
    <input type="text" id="msgInput" placeholder="Ask a question…" />
    <button id="sendBtn">Send</button>
    <div class="chips" id="suggestions"></div>
  </div>
  <div id="menu" class="card" style="display:none;">
    <div class="menu">
      <button id="againBtn">Take Quiz Again</button>
      <button id="logoutBtn">Log out</button>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
